<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appwrite Custom Auth Demo</title>
    <style>
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="info">
        <h3>Custom Token Auth Demo</h3>
        <p>
          This demonstrates using Appwrite's custom token authentication with a
          simulated third-party auth system.
        </p>
        <p>Try: demo@example.com / demo1234</p>
      </div>

      <!-- External Login Form -->
      <div id="loginForm">
        <h2>External Auth System</h2>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required />
        </div>
        <button id="loginButton">Login with External System</button>
      </div>

      <!-- Logged In View -->
      <div id="loggedInView" class="hidden">
        <h2>Welcome!</h2>
        <p id="userInfo"></p>
        <button id="logoutButton">Logout</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
